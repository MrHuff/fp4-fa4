
[build-system]
requires = ["scikit-build-core", "nanobind"]
build-backend = "scikit_build_core.build"

[project]
name = "fused_ops"
version = "0.0.1"
dependencies = ["torch", "quartet2"] # quartet2 for helper/types potentially? No, independent.
requires-python = ">=3.8"

[tool.scikit-build]
wheel.packages = ["python/fused_ops"]
